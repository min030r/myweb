<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a17">
  <title>스네이크 아케이드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1411;
      --panel: #15211c;
      --panel2: #1b2b23;
      --green: #65e68b;
      --text: #eef8f0;
      --muted: #9bb0a1;
      --line: #2a3d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 14px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #1b3025 0%, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: min(100%, 560px); }
    header { text-align: center; margin-bottom: 18px; }
    .eyebrow {
      color: var(--green); font-size: .72rem; font-weight: 800;
      letter-spacing: .22em; margin-bottom: 5px;
    }
    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.4rem); letter-spacing: -.04em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
    .scorebar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 12px; padding: 13px 17px;
      border: 1px solid var(--line); border-radius: 15px;
      background: rgba(21, 33, 28, .92);
    }
    .score-label { color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .08em; }
    .score { color: var(--green); font-size: 1.65rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .status { color: var(--muted); font-size: .82rem; text-align: right; }
    .game-shell {
      position: relative; padding: clamp(8px, 2.5vw, 14px);
      background: #142019; border: 1px solid #304638; border-radius: 19px;
      box-shadow: 0 18px 55px #0008, inset 0 1px #ffffff0b;
    }
    canvas {
      display: block; width: 100%; aspect-ratio: 1; background: #0b120f;
      border: 1px solid #263a2e; border-radius: 10px; touch-action: none;
    }
    .overlay {
      position: absolute; inset: 14px; display: grid; place-items: center;
      padding: 20px; text-align: center; border-radius: 10px;
      background: rgba(5, 12, 8, .76); backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 280px; }
    .overlay h2 { margin: 0 0 8px; font-size: 1.55rem; }
    .overlay p { margin: 0; color: #c0d2c5; line-height: 1.55; font-size: .9rem; }
    .controls { display: flex; gap: 9px; margin-top: 13px; }
    button {
      border: 1px solid #385344; border-radius: 12px; background: var(--panel2);
      color: var(--text); font: inherit; font-weight: 750; cursor: pointer;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    button:hover { background: #263c2e; border-color: #5a8b68; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #8cf5a8; outline-offset: 3px; }
    .controls button { flex: 1; min-height: 46px; }
    .primary { color: #07150b; background: var(--green); border-color: var(--green); }
    .primary:hover { background: #82f2a0; border-color: #82f2a0; }
    .touch-area {
      display: none; margin: 18px auto 0; width: min(100%, 230px);
      grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 58px);
      gap: 8px; touch-action: none;
    }
    .touch-area button {
      font-size: 1.35rem; background: #1b3024; border-color: #42644c;
      box-shadow: 0 4px 0 #0a120d;
    }
    .touch-area button:active { box-shadow: 0 1px 0 #0a120d; }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .help { margin: 16px 0 0; color: var(--muted); font-size: .78rem; text-align: center; line-height: 1.6; }
    @media (pointer: coarse), (max-width: 700px) {
      .touch-area { display: grid; }
      body { padding-top: 16px; padding-bottom: 20px; }
    }
    @media (max-width: 380px) {
      .scorebar { padding: 10px 13px; }
      .controls { gap: 6px; }
      .controls button { min-height: 44px; font-size: .86rem; }
      .touch-area { grid-template-rows: repeat(2, 54px); width: min(100%, 210px); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">ARCADE · CLASSIC</div>
      <h1>스네이크 게임</h1>
      <p class="subtitle">먹이를 먹고 최고 점수에 도전해 보세요!</p>
    </header>

    <section class="scorebar" aria-label="게임 점수와 상태">
      <div>
        <div class="score-label">SCORE</div>
        <div class="score" id="score">000</div>
      </div>
      <div class="status" id="status" aria-live="polite">시작할 준비가 됐어요</div>
    </section>

    <section class="game-shell" aria-label="스네이크 게임 화면">
      <canvas id="game" width="600" height="600" aria-label="20 곱하기 20 격자 스네이크 게임"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">준비됐나요?</h2>
          <p id="overlayText">시작 버튼을 누르면 게임이 시작돼요.<br>방향키 또는 화면 버튼으로 움직이세요.</p>
        </div>
      </div>
    </section>

    <div class="controls">
      <button class="primary" id="startBtn">게임 시작</button>
      <button id="pauseBtn">일시정지</button>
      <button id="restartBtn">다시 시작</button>
    </div>

    <nav class="touch-area" aria-label="터치 방향 조작">
      <button class="up" data-dir="up" aria-label="위쪽">▲</button>
      <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="down" data-dir="down" aria-label="아래쪽">▼</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
    </nav>

    <p class="help">PC: 키보드 방향키로 조작 · 스마트폰/태블릿: 화면 방향 버튼 사용<br>먹이를 먹을 때마다 +10점 · 벽이나 자기 몸에 닿으면 게임 종료</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 20;
      const CELL = 30;
      const STEP_MS = 125;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");

      let snake, food, direction, nextDirection, score;
      let state = "ready"; // ready, running, paused, over
      let lastStep = 0;
      let animationId = null;

      const vectors = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const opposite = { up: "down", down: "up", left: "right", right: "left" };

      function resetGame() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = "right";
        nextDirection = "right";
        score = 0;
        placeFood();
        updateScore();
        state = "ready";
        statusEl.textContent = "시작할 준비가 됐어요";
        startBtn.textContent = "게임 시작";
        pauseBtn.textContent = "일시정지";
        showOverlay("준비됐나요?", "시작 버튼을 누르면 게임이 시작돼요.<br>방향키 또는 화면 버튼으로 움직이세요.");
        draw();
      }

      function placeFood() {
        const empty = [];
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!snake.some(part => part.x === x && part.y === y)) empty.push({ x, y });
          }
        }
        food = empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
      }

      function updateScore() {
        scoreEl.textContent = String(score).padStart(3, "0");
      }

      function showOverlay(title, message) {
        overlayTitle.textContent = title;
        overlayText.innerHTML = message;
        overlay.hidden = false;
      }

      function hideOverlay() {
        overlay.hidden = true;
      }

      function startGame() {
        if (state === "running") return;
        if (state === "over") resetGame();
        state = "running";
        statusEl.textContent = "플레이 중";
        startBtn.textContent = "게임 진행 중";
        hideOverlay();
        lastStep = performance.now();
        if (animationId === null) animationId = requestAnimationFrame(gameLoop);
      }

      function pauseGame() {
        if (state === "running") {
          state = "paused";
          statusEl.textContent = "일시정지";
          startBtn.textContent = "계속하기";
          showOverlay("잠깐 쉬어가기", "계속하려면 시작 버튼을 누르세요.");
        } else if (state === "paused") {
          startGame();
        }
      }

      function endGame(won = false) {
        state = "over";
        statusEl.textContent = won ? "승리!" : "게임 종료";
        startBtn.textContent = "다시 시작";
        showOverlay(won ? "완벽해요!" : "게임 오버!", `최종 점수는 <strong>${score}점</strong>이에요.<br>다시 시작 버튼을 눌러 재도전하세요.`);
      }

      function setDirection(requested) {
        if (!vectors[requested] || state === "over") return;
        // 현재 이동 방향의 정반대는 즉시 적용하지 않아 몸통과 겹치는 입력을 막는다.
        // 한 칸 이동 전 여러 번 눌러도 마지막 유효 입력만 보관한다.
        if (requested === opposite[direction]) return;
        if (requested === opposite[nextDirection]) return;
        nextDirection = requested;
      }

      function step() {
        direction = nextDirection;
        const vector = vectors[direction];
        const head = { x: snake[0].x + vector.x, y: snake[0].y + vector.y };
        const eating = food && head.x === food.x && head.y === food.y;

        // 먹이를 먹지 않는 경우 꼬리가 같은 틱에 이동하므로 기존 꼬리 칸 진입은 허용한다.
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        const hitWall = head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE;
        const hitSelf = bodyToCheck.some(part => part.x === head.x && part.y === head.y);

        if (hitWall || hitSelf) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          updateScore();
          placeFood();
          if (!food) {
            draw();
            endGame(true);
            return;
          }
        } else {
          snake.pop();
        }
        draw();
      }

      function gameLoop(now) {
        if (state === "running") {
          if (now - lastStep >= STEP_MS) {
            // 프레임이 잠깐 밀려도 한 번에 여러 칸 순간이동하지 않도록 한 틱씩 처리
            lastStep = now;
            step();
          }
        }
        if (state === "running" || state === "paused") {
          animationId = requestAnimationFrame(gameLoop);
        } else {
          animationId = null;
        }
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0b120f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 20 × 20 격자
        ctx.strokeStyle = "rgba(120, 160, 130, 0.10)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= SIZE; i++) {
          const p = i * CELL + 0.5;
          ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(canvas.width, p); ctx.stroke();
        }

        if (food) {
          const cx = food.x * CELL + CELL / 2;
          const cy = food.y * CELL + CELL / 2;
          ctx.fillStyle = "#ff6b6b";
          ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.31, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#ffd0a8";
          ctx.beginPath(); ctx.arc(cx - 3, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
        }

        snake.forEach((part, index) => {
          const inset = index === 0 ? 2 : 3;
          ctx.fillStyle = index === 0 ? "#91ffad" : (index % 2 ? "#58dc7e" : "#43c96b");
          roundedRect(part.x * CELL + inset, part.y * CELL + inset,
            CELL - inset * 2, CELL - inset * 2, index === 0 ? 8 : 6);
        });

        // 뱀 머리 눈
        if (snake.length) {
          const head = snake[0];
          const baseX = head.x * CELL;
          const baseY = head.y * CELL;
          ctx.fillStyle = "#102117";
          let eyes;
          if (direction === "right") eyes = [[21, 9], [21, 20]];
          else if (direction === "left") eyes = [[9, 9], [9, 20]];
          else if (direction === "up") eyes = [[9, 9], [20, 9]];
          else eyes = [[9, 21], [20, 21]];
          eyes.forEach(([x, y]) => {
            ctx.beginPath(); ctx.arc(baseX + x, baseY + y, 2.1, 0, Math.PI * 2); ctx.fill();
          });
        }
      }

      document.addEventListener("keydown", event => {
        const keys = {
          ArrowUp: "up", ArrowDown: "down",
          ArrowLeft: "left", ArrowRight: "right"
        };
        const requested = keys[event.key];
        if (requested) {
          event.preventDefault();
          setDirection(requested);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "running") pauseGame();
          else if (state === "ready" || state === "paused") startGame();
        }
      });

      document.querySelectorAll("[data-dir]").forEach(button => {
        const press = event => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        };
        button.addEventListener("pointerdown", press);
        button.addEventListener("click", press);
      });

      startBtn.addEventListener("click", () => {
        if (state === "over") resetGame();
        startGame();
      });
      pauseBtn.addEventListener("click", pauseGame);
      restartBtn.addEventListener("click", resetGame);

      // 탭을 벗어나 돌아왔을 때 시간이 한꺼번에 흐르지 않도록 한다.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "running") pauseGame();
      });

      resetGame();
    })();
  </script>
</body>
</html>
